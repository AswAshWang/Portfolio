<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashe Wang — Portfolio</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/hub.css" />
  </head>
  <body class="home-page">
    <header class="site-header site-header--over-hero" id="site-header">
      <a class="site-logo" href="index.html" data-i18n="site.name"></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="games/index.html" data-i18n="nav.games"></a>
        <a href="art/index.html" data-i18n="nav.art"></a>
        <a href="other/index.html" data-i18n="nav.other"></a>
        <a href="about.html" data-i18n="nav.about"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-locale="zh">中文</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-set-locale="en" class="is-active">EN</button>
      </div>
    </header>

    <main class="home-main">
      <section class="home-hero" aria-label="Intro">
        <div class="home-hero__overlay" aria-hidden="true"></div>

        <div class="home-hero__bottom">
          <div class="home-hero__panel">
            <div class="home-hero__intro-grid">
              <div class="home-hero__intro-left">
                <h1 class="home-hero__title">
                  <span class="home-hero__title-line" data-i18n="home.heroLine1"></span>
                  <span class="home-hero__title-line" data-i18n="home.heroLine2"></span>
                  <span class="home-hero__title-line home-hero__title-line--soft" data-i18n="home.heroLine3"></span>
                </h1>
                <p class="home-hero__nick" data-i18n="home.welcomeNick"></p>
              </div>
              <div class="home-hero__intro-right">
                <p data-i18n="home.intro1"></p>
                <p data-i18n="home.intro2"></p>
                <p data-i18n="home.intro3"></p>
              </div>
            </div>
          </div>

          <a class="home-hero__scroll" href="#hub-tiles">
            <span data-i18n="hub.scrollHint"></span>
            <span class="home-hero__scroll-icon" aria-hidden="true">↓</span>
          </a>
        </div>
      </section>

      <section class="home-hub" id="hub-tiles" aria-label="Sections">
        <div class="home-hub__inner">
          <header class="home-hub__head">
            <h2 class="home-hub__section-title" data-i18n="hub.sectionTitle"></h2>
          </header>

          <div class="home-hub__grid">
            <a class="home-tile home-tile--games" href="games/index.html">
              <div class="home-tile__media" aria-hidden="true"></div>
              <div class="home-tile__body">
                <p class="home-tile__index">
                  <span class="home-tile__num">01</span>
                  <span class="home-tile__sep" aria-hidden="true">·</span>
                  <span class="home-tile__label" data-i18n="hub.panels.games.label"></span>
                </p>
                <h3 class="home-tile__title" data-i18n="hub.panels.games.title"></h3>
                <div class="home-tile__foot">
                  <span class="home-tile__cta" data-i18n="hub.panels.games.cta"></span>
                  <span class="home-tile__go" aria-hidden="true">→</span>
                </div>
              </div>
            </a>

            <a class="home-tile home-tile--art" href="art/index.html">
              <div class="home-tile__media" aria-hidden="true"></div>
              <div class="home-tile__body">
                <p class="home-tile__index">
                  <span class="home-tile__num">02</span>
                  <span class="home-tile__sep" aria-hidden="true">·</span>

                </p>
                <h3 class="home-tile__title" data-i18n="hub.panels.art.title"></h3>
                <div class="home-tile__foot">
                  <span class="home-tile__cta" data-i18n="hub.panels.art.cta"></span>
                  <span class="home-tile__go" aria-hidden="true">→</span>
                </div>
              </div>
            </a>

            <a class="home-tile home-tile--other" href="other/index.html">
              <div class="home-tile__media" aria-hidden="true"></div>
              <div class="home-tile__body">
                <p class="home-tile__index">
                  <span class="home-tile__num">03</span>
                  <span class="home-tile__sep" aria-hidden="true">·</span>
                  <span class="home-tile__label" data-i18n="hub.panels.other.label"></span>
                </p>
                <h3 class="home-tile__title" data-i18n="hub.panels.other.title"></h3>
                <div class="home-tile__foot">
                  <span class="home-tile__cta" data-i18n="hub.panels.other.cta"></span>
                  <span class="home-tile__go" aria-hidden="true">→</span>
                </div>
              </div>
            </a>

            <a class="home-tile home-tile--about" href="about.html">
              <div class="home-tile__media" aria-hidden="true"></div>
              <div class="home-tile__body">
                <p class="home-tile__index">
                  <span class="home-tile__num">04</span>
                  <span class="home-tile__sep" aria-hidden="true">·</span>
                  <span class="home-tile__label" data-i18n="hub.panels.about.label"></span>
                </p>
                <h3 class="home-tile__title" data-i18n="hub.panels.about.title"></h3>
                <div class="home-tile__foot">
                  <span class="home-tile__cta" data-i18n="hub.panels.about.cta"></span>
                  <span class="home-tile__go" aria-hidden="true">→</span>
                </div>
              </div>
            </a>
