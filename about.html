<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About — Ashe Wang</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="index.html" data-i18n="site.name"></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="games/index.html" data-i18n="nav.games"></a>
        <a href="art/index.html" data-i18n="nav.art"></a>
        <a href="about.html" data-i18n="nav.about"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-locale="zh">中文</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-set-locale="en" class="is-active">EN</button>
      </div>
    </header>

    <main class="page-main page-main--inner">
      <a class="back-link" href="index.html" data-i18n="footer.backToHub"></a>
      <h1 class="page-title" data-i18n="about.pageTitle"></h1>

      <div class="about-layout">
        <figure class="about-photo">
          <img
            src="assets/images/about-photo.jpg"
            alt=""
            data-i18n-attr="alt:about.photoAlt"
          />
        </figure>
        <div class="about-content">
          <div class="about-content__intro">
            <h2 class="about-name" data-i18n="about.heading"></h2>
            <p class="about-role" data-i18n="about.role"></p>
            <p data-i18n="about.bio1"></p>
            <p data-i18n="about.bio2"></p>
            <p data-i18n="about.bio3"></p>
          </div>
          <div class="detail-section">
            <h2 data-i18n="about.skillsTitle"></h2>
            <p data-i18n="about.toolsLine"></p>
            <p data-i18n="about.focusLine"></p>
          </div>
          <div class="detail-section">
            <h2 data-i18n="about.contactTitle"></h2>
            <p data-i18n="about.contactIntro"></p>
            <p class="about-artstation">
              <span data-i18n="about.artStationLabel"></span>
              <a
                href="https://www.artstation.com/ashewang"
                target="_blank"
                rel="noopener noreferrer"
                >https://www.artstation.com/ashewang</a
              >
            </p>
            <p>
              <span data-i18n="about.emailLabel"></span>:
              <a href="mailto:aswashewang@gmail.com" data-i18n="about.email"></a>
            </p>
            <p>
              <span data-i18n="about.resumeLabel"></span>:
              <a href="assets/files/resume.pdf" data-i18n="about.resumeLink"></a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer.copyright"></p>
    </footer>

    <script src="js/i18n.js" data-base="./"></script>
    <script src="js/nav.js"></script>
  </body>
</html>
